name: Build & Test

# YouTube Aura has one build: the webOS 3 / Chromium 38 bundle for the
# LG OLED55B7V. Every push is compiled, tested and packaged, so the artifact
# from any green run is installable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No install scripts: only the webOS CLI has any (an optional native SSH
      # binding), and the build and tests do not need it.
      - run: npm ci --ignore-scripts

      # Formatting, lint, types, the code map, the build and every test script,
      # the ES5 and CSS compatibility checks included.
      - run: npm test

      - name: Package the .ipk
        run: |
          # A package committed to dist/ (the release asset) must not be
          # packaged again: start from an empty shelf.
          rm -f dist/*.ipk
          npm run package

      - name: Name the artifact for the OLED55B7V
        run: |
          for f in dist/*.ipk; do
            base="$(basename "${f%.ipk}")"
            cp "$f" "dist/${base}_oled55b7v.ipk"
          done
          ls -l dist/*.ipk

      - name: Upload the .ipk
        uses: actions/upload-artifact@v4
        with:
          name: youtube-aura-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Upload the performance report
        run: |
          mkdir -p bench-out
          node tests/bench/hook-bench.cjs > bench-out/hook.txt
          node tests/bench/panel-bench.cjs > bench-out/panel.txt
          node tests/bench/boot-bench.cjs > bench-out/boot.txt
          node tests/bench/emoji-bench.cjs > bench-out/emoji.txt
          node tests/bench/parse-breakdown.cjs > bench-out/parse.txt
          cat bench-out/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-out/*.txt
