<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- The Aura mark, as the source the PNG icons are drawn from. The TV reads
       only the PNGs appinfo.json names; tools/gen-icons.mjs draws those with the
       same geometry, so the two must stay in step. Flat on purpose: true black
       (an OLED pixel that is off), one ice-blue ring (#8AB4F8), and a white
       play triangle whose centroid sits at the centre of the ring (a triangle
       centred on its bounding box reads as too far left). -->
  <rect width="400" height="400" fill="#040506"/>
  <circle cx="200" cy="200" r="148.8" fill="none" stroke="#8AB4F8" stroke-width="4.96"/>
  <path d="M166.5 137.4 L166.5 262.6 L267.0 200 Z" fill="#ffffff"/>
</svg>
